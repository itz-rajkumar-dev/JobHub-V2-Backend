spring.application.name=CategoryService
server.port=8084
config.message=JobHub Config Server Working
spring.config.import=optional:configserver:http://localhost:8888
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jobhub_category
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# File Storage
file.upload-dir=uploads/resumes
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=100MB

cloudinary.cloud-name= p5odntun
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

eureka.instance.prefer-ip-address=true

