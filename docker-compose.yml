
services:
  config-server:
    image: jobhub-config-server:1.0
    container_name: jobhub-config-server
    ports:
      - "8888:8888"
    volumes:
      - "${CONFIG_REPO_PATH:-C:/Users/navne/OneDrive/Documents/MicroService Project/jobhub_config}:/config-repo"
    environment:
       SPRING_PROFILES_ACTIVE: docker,native
    restart: unless-stopped
    networks:
      - jobhub-network

  eureka-server:
    image: jobhub-eureka-server:1.0
    container_name: jobhub-eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - config-server
    restart: unless-stopped
    networks:
      - jobhub-network

 
  api-gateway:
    image: jobhub-api-gateway:1.0
    container_name: jobhub-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - jobhub-network
    
  
  
  auth-service:
    image: jobhub-auth-service:1.0
    container_name: jobhub-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${AUTH_DB_URL}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
      JOBHUB_MAIL_FROM: ${JOBHUB_MAIL_FROM}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - jobhub-network


    
  
  user-service:
    image: jobhub-user-service:1.0
    container_name: jobhub-user-service
    ports:
      - "8082:8082"
    environment:
     SPRING_PROFILES_ACTIVE: docker
     DB_URL: ${USER_DB_URL}
     DB_USERNAME: ${USER_DB_USERNAME}
     DB_PASSWORD: ${USER_DB_PASSWORD}
     JWT_SECRET: ${JWT_SECRET}
     CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
     CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
     CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - jobhub-network


     
     
  profile-service:
    image: jobhub-profile-service:1.0
    container_name: jobhub-profile-service
    ports:
      - "8083:8083"
    environment:
       SPRING_PROFILES_ACTIVE: docker
       DB_URL: jdbc:postgresql://host.docker.internal:5432/jobhub_profile
       DB_USERNAME: ${PROFILE_DB_USERNAME}
       DB_PASSWORD: ${PROFILE_DB_PASSWORD}
       JWT_SECRET: ${JWT_SECRET}
       CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
       CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
       CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - config-server
      - eureka-server
    restart: unless-stopped
    networks:
      - jobhub-network

   
  
  job-service:
    image: jobhub-job-service:1.0
    container_name: jobhub-job-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${JOB_DB_URL}
      DB_USERNAME: ${JOB_DB_USERNAME}
      DB_PASSWORD: ${JOB_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - config-server
      - eureka-server
    restart: unless-stopped
    networks:
      - jobhub-network


  
  search-service:
    image: jobhub-search-service:1.0
    container_name: jobhub-search-service
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - config-server
      - eureka-server
      - kafka
    restart: unless-stopped
    networks:
      jobhub-network:
        
  
  kafka:
    image: apache/kafka:4.1.0
    container_name: jobhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped
    networks:
      - jobhub-network



 

  
  company-service:
    image: jobhub-company-service:1.0
    container_name: jobhub-company-service
    ports:
      - "8084:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://host.docker.internal:5432/jobhub_company
      DB_USERNAME: ${COMPANY_DB_USERNAME}
      DB_PASSWORD: ${COMPANY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - jobhub-network 


  savedjob-service:
    image: jobhub-savedjob-service:1.0
    container_name: jobhub-savedjob-service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://host.docker.internal:3306/jobhub_savedjob
      DB_USERNAME: ${SAVEDJOB_DB_USERNAME}
      DB_PASSWORD: ${SAVEDJOB_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - jobhub-network


  
  category-service:
    image: jobhub-category-service:1.0
    container_name: jobhub-category-service
    ports:
      - "8086:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${CATEGORY_DB_URL}
      DB_USERNAME: ${CATEGORY_DB_USERNAME}
      DB_PASSWORD: ${CATEGORY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - config-server
      - eureka-server
    restart: unless-stopped
    networks:
      - jobhub-network
  

 
  notification-service:
    image: jobhub-notification-service:1.0
    container_name: jobhub-notification-service
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://host.docker.internal:5432/jobhub_notification
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - config-server
      - eureka-server
      - kafka
    restart: unless-stopped
    networks:
      - jobhub-network
 
 
  application-service:
    image: jobhub-application-service:1.0
    container_name: jobhub-application-service
    ports:
      - "8088:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${APPLICATION_DB_URL}
      DB_USERNAME: ${APPLICATION_DB_USERNAME}
      DB_PASSWORD: ${APPLICATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - config-server
      - eureka-server
      - kafka
    restart: unless-stopped
    networks:
      - jobhub-network

  engagement-service:
    build:
      context: ./EngagementService_JobHubV2
      dockerfile: Dockerfile
    image: jobhub-engagement-service:1.0
    container_name: jobhub-engagement-service
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://host.docker.internal:5432/jobhub_engagementservice
      DB_USERNAME: ${ENGAGEMENT_DB_USERNAME}
      DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - config-server
      - eureka-server
    restart: unless-stopped
    networks:
      - jobhub-network     


  
  dashboard-service:
    image: jobhub-dashboard-service:1.0
    container_name: jobhub-dashboard-service
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - config-server
      - eureka-server
    restart: unless-stopped
    networks:
      - jobhub-network


networks:
  jobhub-network:
    driver: bridge

volumes:
  opensearch-data:    


